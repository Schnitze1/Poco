name: CI

on:
  push:
    # A main push starts the delivery workflow, which calls this CI.
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the validated frontend build for Pages deployment
        type: boolean
        default: false
      api-stage:
        description: API stage embedded in the frontend build
        type: string
        default: dev

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pii-tool
    env:
      # Test session/storage behaviour without accessing live AWS resources.
      DYNAMODB_TABLE: ''
      S3_BUCKET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Install Rust coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run backend tests with coverage
        id: backend_coverage
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --no-report -- --test-threads=1
      - name: Generate backend coverage reports
        if: ${{ !cancelled() && (steps.backend_coverage.outcome == 'success' || steps.backend_coverage.outcome == 'failure') }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --json --summary-only --output-path coverage/coverage-summary.json
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --fail-under-lines 80 | tee coverage/summary.txt
      - name: Summarise backend coverage
        if: ${{ !cancelled() && hashFiles('pii-tool/coverage/coverage-summary.json') != '' }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('coverage/coverage-summary.json').read_text())
          totals = report['data'][0]['totals']
          rows = ['## Backend coverage', '', '| Metric | Coverage | Covered / Total |', '|---|---:|---:|']
          for label, key in [('Lines', 'lines'), ('Functions', 'functions'), ('Regions', 'regions')]:
              metric = totals[key]
              rows.append(f"| {label} | {metric['percent']:.2f}% | {metric['covered']} / {metric['count']} |")
          rows += ['', 'Scope: Rust workspace sources. Dependencies, generated files and standalone test files are excluded by cargo-llvm-cov; inline unit-test modules remain included.',
                   'Gate: at least 80% line coverage. Test and coverage failures fail CI.', '']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(rows))
          PY
      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: pii-tool/coverage/
          if-no-files-found: error
          retention-days: 30

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Summarise frontend coverage
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'))
          const rows = ['## Frontend coverage', '', '| Metric | Coverage | Covered / Total |', '|---|---:|---:|']
          for (const [label, key] of [['Lines', 'lines'], ['Statements', 'statements'], ['Functions', 'functions'], ['Branches', 'branches']]) {
            const metric = total[key]
            rows.push(`| ${label} | ${metric.pct}% | ${metric.covered} / ${metric.total} |`)
          }
          rows.push('', 'Scope: all src/**/*.ts and src/**/*.tsx files, including unimported files; test and declaration files are excluded.',
            'Gate: at least 80% line coverage. Test and coverage failures fail CI.', '')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join('\n'))
          NODE
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: error
          retention-days: 30
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          writeFileSync('dist/deployment.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            stage: process.env.VITE_API_STAGE,
          }))
          NODE
        env:
          VITE_API_STAGE: ${{ inputs.api-stage || 'dev' }}
      - name: Upload validated Pages artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
