name: CI

on:
  push:
    # A develop push starts the delivery workflow, which calls this CI.
    branches-ignore:
      - develop
  pull_request:
    branches:
      - develop
      - main
      - test/qa
      - 'release/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the validated frontend build for Pages deployment
        type: boolean
        default: false
      api-stage:
        description: API stage embedded in the frontend build
        type: string
        default: dev

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pii-tool
    env:
      # Test session/storage behaviour without accessing live AWS resources.
      DYNAMODB_TABLE: ''
      S3_BUCKET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Run backend tests
        run: cargo test --locked --workspace -- --test-threads=1

  frontend-checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          writeFileSync('dist/deployment.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            stage: process.env.VITE_API_STAGE,
          }))
          NODE
        env:
          VITE_API_STAGE: ${{ inputs.api-stage || 'dev' }}
      - name: Upload validated Pages artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
